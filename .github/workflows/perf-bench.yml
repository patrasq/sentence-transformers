name: perf-bench

on:
  push:
    branches:
      - perf-bench

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -c "import torch, transformers, tokenizers, sentence_transformers as st; print(torch.__version__, transformers.__version__, tokenizers.__version__, st.__version__)"

      - name: Machine
        run: |
          {
            echo "### Machine"
            echo
            echo "- CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p'), $(nproc) cores"
            echo "- $(python -c 'import torch, tokenizers, sentence_transformers as st; print(f"torch {torch.__version__}, tokenizers {tokenizers.__version__}, sentence-transformers {st.__version__}")')"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tokenizer, parallelism on
        run: TOKENIZERS_PARALLELISM=true python perf_bench/bench.py tokenizer | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tokenizer, parallelism off
        run: TOKENIZERS_PARALLELISM=false python perf_bench/bench.py tokenizer | tee -a "$GITHUB_STEP_SUMMARY"

      - name: encode, static model
        run: python perf_bench/bench.py encode sentence-transformers/static-retrieval-mrl-en-v1 200000 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: encode, MiniLM
        run: python perf_bench/bench.py encode sentence-transformers/all-MiniLM-L6-v2 10000 | tee -a "$GITHUB_STEP_SUMMARY"
