name: perf-bench

on:
  push:
    branches:
      - perf-bench

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the two trees
        run: |
          git clone --quiet --depth 1 https://github.com/huggingface/sentence-transformers.git variants/main
          git clone --quiet --depth 1 --branch perf-static-encode https://github.com/patrasq/sentence-transformers.git variants/fix
          echo "main: $(git -C variants/main rev-parse --short HEAD)  fix: $(git -C variants/fix rev-parse --short HEAD)"

      - name: Install dependencies only (sentence-transformers is imported from each tree via PYTHONPATH)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=5.0.0,<6.0.0" "tokenizers>=0.19" "huggingface-hub>=1.3.0,<3.0.0" numpy scikit-learn scipy typing_extensions tqdm

      - name: A/B encode benchmark
        run: |
          {
            echo "### A/B: upstream main ($(git -C variants/main rev-parse --short HEAD)) vs perf-static-encode ($(git -C variants/fix rev-parse --short HEAD))"
            echo
            echo "- CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p'), $(nproc) cores"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python perf_bench/ab.py variants/main variants/fix | tee -a "$GITHUB_STEP_SUMMARY"
